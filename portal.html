<!DOCTYPE html>
<html>
<head>
<title>CSC Portal</title>

<!-- Stylish Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
background:radial-gradient(circle at top,#0f2027,#203a43,#2c5364);
display:flex;
flex-direction:column;
color:white;
font-family:'Poppins',sans-serif;
overflow-x:hidden;
}

/* ===== HEADER ===== */
header{
padding:30px;
text-align:center;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(25px);
box-shadow:0 0 30px rgba(0,255,255,0.7);
border-bottom:1px solid rgba(0,255,255,0.4);
}

/* Stylish Portal Name */
header h1{
font-family:'Orbitron',sans-serif;
font-size:32px;
letter-spacing:4px;
color:#00f2fe;
text-transform:uppercase;
text-shadow:
0 0 10px #00f2fe,
0 0 20px #00f2fe,
0 0 40px #00f2fe;
}

/* ===== MAIN GLASS BOX ===== */
.portal-container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:60px 20px;
}

.glass-box{
width:100%;
max-width:950px;
padding:50px;
border-radius:30px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(30px);
box-shadow:0 0 40px rgba(0,255,255,0.4);
}

/* ===== CATEGORY ===== */
.category{
margin-bottom:45px;
}

.category h3{
font-family:'Orbitron',sans-serif;
letter-spacing:2px;
margin-bottom:20px;
color:#00f2fe;
text-shadow:0 0 10px #00f2fe;
}

/* ===== PORTAL BUTTON ===== */
.portal-btn{
position:relative;
overflow:hidden;
display:inline-block;
margin:10px;
padding:14px 28px;
border-radius:35px;
text-decoration:none;
font-family:'Orbitron',sans-serif;
letter-spacing:1px;
font-size:14px;
color:white;
background:rgba(0,255,255,0.15);
border:1px solid rgba(0,255,255,0.5);
cursor:pointer;
transition:0.3s;
}

/* Hover Glow Effect */
.portal-btn:hover{
background:#00f2fe;
color:black;
box-shadow:
0 0 15px #00f2fe,
0 0 30px #00f2fe,
0 0 60px #00f2fe;
transform:translateY(-3px);
}

/* Click Animation */
.portal-btn:active{
transform:scale(0.9);
box-shadow:0 0 25px #00d9ff;
}

/* Ripple Effect */
.portal-btn::after{
content:'';
position:absolute;
top:50%;
left:50%;
width:0;
height:0;
background:rgba(0,0,0,0.3);
border-radius:50%;
transform:translate(-50%,-50%);
transition:width 0.4s ease,height 0.4s ease;
}

.portal-btn:active::after{
width:200px;
height:200px;
}

/* BACK BUTTON */
.back-btn{
display:inline-block;
margin-top:30px;
padding:12px 25px;
border-radius:25px;
text-decoration:none;
color:white;
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
transition:0.3s;
}

.back-btn:hover{
background:white;
color:black;
}

footer{
text-align:center;
padding:20px;
background:rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<header>
<h1>CSC PORTAL ACCESS SYSTEM</h1>
</header>

<div class="portal-container">
<div class="glass-box">

<div class="category">
<h3>IDENTITY SERVICES</h3>
<a href="#" class="portal-btn">AADHAAR PORTAL</a>
<a href="#" class="portal-btn">PAN PORTAL</a>
</div>

<div class="category">
<h3>BANKING SERVICES</h3>
<a href="#" class="portal-btn">AEPS PORTAL</a>
<a href="#" class="portal-btn">BANK CSP</a>
</div>

<div class="category">
<h3>OTHER SERVICES</h3>
<a href="#" class="portal-btn">ELECTRICITY BILL</a>
<a href="#" class="portal-btn">INSURANCE PORTAL</a>
</div>

<a href="index.html" class="back-btn">⬅ Back to Home</a>

</div>
</div>

<footer>
Address:-Middle School Bahuari | Nishu Computer Common Service Center
</footer>

</body>
</html>
